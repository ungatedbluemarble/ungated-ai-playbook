<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A hand-drawn roadmap of eight steps in two rows. Row one, left to right: 1 start with what you own, 2 ask everyone the same questions, 3 put every team at one table, 4 prepare before you prompt. Row two, right to left: 5 right model for each stage, 6 build the rules into the tools, 7 argue with ideas before investing, 8 grow your own people. The end state is a team that runs it without me.">
<style>
.bg{fill:#FFFFFF;stroke:#DEDAD4;stroke-width:1.5}
.s{fill:none;stroke:#1C1B1A;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.p{fill:none;stroke:#B3261E;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{font-family:Georgia,'Times New Roman',serif;font-size:16px;fill:#1C1B1A}
.ts{font-family:Georgia,'Times New Roman',serif;font-size:12.5px;fill:#5E5A55}
.n{font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:700;fill:#1C1B1A}
.np{font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:700;fill:#B3261E}
.h{font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive;font-size:19px;fill:#B3261E}
.hd{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:700;fill:#1C1B1A}
</style>
<rect class="bg" x="1" y="1" width="898" height="448" rx="12"/>
<text class="hd" x="30" y="40">The method, in the order I work</text>

<!-- row 1, left to right -->
<path class="s" d="M154 120 C200 117 258 123 306 120"/><path class="s" d="M297 114 L307 120 L297 127"/>
<path class="s" d="M354 120 C400 123 458 117 506 120"/><path class="s" d="M497 114 L507 120 L497 127"/>
<path class="s" d="M554 120 C600 117 658 123 706 120"/><path class="s" d="M697 114 L707 120 L697 127"/>
<circle class="s" cx="130" cy="120" r="24"/><text class="n" x="130" y="127" text-anchor="middle">1</text>
<circle class="s" cx="330" cy="120" r="24"/><text class="n" x="330" y="127" text-anchor="middle">2</text>
<circle class="s" cx="530" cy="120" r="24"/><text class="n" x="530" y="127" text-anchor="middle">3</text>
<circle class="s" cx="730" cy="120" r="24"/><text class="n" x="730" y="127" text-anchor="middle">4</text>

<text class="t" x="130" y="173" text-anchor="middle">Start with</text><text class="t" x="130" y="193" text-anchor="middle">what you own</text><text class="ts" x="130" y="214" text-anchor="middle">learn the platform deeply</text>
<text class="t" x="330" y="173" text-anchor="middle">Ask everyone</text><text class="t" x="330" y="193" text-anchor="middle">the same questions</text><text class="ts" x="330" y="214" text-anchor="middle">differences come from answers</text>
<text class="t" x="530" y="173" text-anchor="middle">Put every team</text><text class="t" x="530" y="193" text-anchor="middle">at one table</text><text class="ts" x="530" y="214" text-anchor="middle">infra, eng, R&amp;D, security, AI</text>
<text class="t" x="730" y="173" text-anchor="middle">Prepare before</text><text class="t" x="730" y="193" text-anchor="middle">you prompt</text><text class="ts" x="730" y="214" text-anchor="middle">plan, clean data, define good</text>

<!-- turn down from 4 to 5 -->
<path class="s" d="M756 116 C880 124 884 318 762 326"/><path class="s" d="M773 319 L761 326 L772 333"/>

<!-- row 2, right to left -->
<path class="s" d="M706 330 C658 333 600 327 554 330"/><path class="s" d="M563 324 L553 330 L563 337"/>
<path class="s" d="M506 330 C458 327 400 333 354 330"/><path class="s" d="M363 324 L353 330 L363 337"/>
<path class="s" d="M306 330 C258 333 200 327 154 330"/><path class="s" d="M163 324 L153 330 L163 337"/>
<circle class="s" cx="730" cy="330" r="24"/><text class="n" x="730" y="337" text-anchor="middle">5</text>
<circle class="s" cx="530" cy="330" r="24"/><text class="n" x="530" y="337" text-anchor="middle">6</text>
<circle class="s" cx="330" cy="330" r="24"/><text class="n" x="330" y="337" text-anchor="middle">7</text>
<circle class="p" cx="130" cy="330" r="27"/><text class="np" x="130" y="337" text-anchor="middle">8</text>

<text class="t" x="730" y="383" text-anchor="middle">Right model</text><text class="t" x="730" y="403" text-anchor="middle">for each stage</text><text class="ts" x="730" y="424" text-anchor="middle">benchmarked, costed per task</text>
<text class="t" x="530" y="383" text-anchor="middle">Build the rules</text><text class="t" x="530" y="403" text-anchor="middle">into the tools</text><text class="ts" x="530" y="424" text-anchor="middle">applied before output</text>
<text class="t" x="330" y="383" text-anchor="middle">Argue with ideas</text><text class="t" x="330" y="403" text-anchor="middle">before investing</text><text class="ts" x="330" y="424" text-anchor="middle">several AI views at once</text>
<text class="t" x="130" y="383" text-anchor="middle">Grow your</text><text class="t" x="130" y="403" text-anchor="middle">own people</text><text class="ts" x="130" y="424" text-anchor="middle">champions in every team</text>

<g transform="rotate(-2 170 270)"><text class="h" x="40" y="268">the goal: a team that runs it without me</text></g>
</svg>
